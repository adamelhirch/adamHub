<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual-mode auth resolution</title>
  <!-- Type: Flowchart (decision branches). Budget: 7 nodes, 7 arrows.
       Cut: the "invalid JWT token" case is folded into the NO branch — in code an
       invalid token behaves exactly like a missing one (falls through to X-API-Key). -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Dual-mode auth</p>
    <h1>Resolving the acting user</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dual-mode-auth-title dual-mode-auth-desc">
      <title id="dual-mode-auth-title">Resolving the acting user</title>
      <desc id="dual-mode-auth-desc">Flowchart showing how a request resolves to an acting user: a valid JWT Bearer token resolves to that user, otherwise a valid shared X-API-Key resolves to the ADAMHUB_OWNER_EMAIL owner, otherwise the request is rejected with 401. Both authenticated paths converge on the same downstream request handling.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <line x1="320" y1="88" x2="320" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="224" x2="320" y2="256" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="420" y1="176" x2="540" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="224" x2="640" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="740" y1="176" x2="820" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 320,304 V 336 Q 320,344 328,344 H 392 Q 400,344 400,352 V 368"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 640,304 V 336 Q 640,344 632,344 H 568 Q 560,344 560,352 V 368"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="280" y="228" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="296" y="236" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="476" y="156" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="488" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="664" y="228" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="680" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="776" y="156" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="788" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <!-- Start oval -->
      <rect x="240" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="320" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Request</text>
      <text x="320" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP · any route</text>

      <!-- Diamond: valid JWT bearer? -->
      <polygon points="320,128 420,176 320,224 220,176" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Valid JWT</text>
      <text x="320" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bearer token?</text>

      <!-- Diamond: valid X-API-Key? -->
      <polygon points="640,128 740,176 640,224 540,176" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Valid shared</text>
      <text x="640" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">X-API-Key?</text>

      <!-- End oval: 401 -->
      <rect x="820" y="152" width="120" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="880" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">401</text>
      <text x="880" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unauthorized</text>

      <!-- Step: Acting user from JWT -->
      <rect x="220" y="256" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Acting user · JWT</text>
      <text x="320" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">resolve_optional_user</text>

      <!-- Step: Acting user from X-API-Key -->
      <rect x="540" y="256" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Acting user · Owner</text>
      <text x="640" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ADAMHUB_OWNER_EMAIL</text>

      <!-- Step: handle request (focal coral — both paths converge here) -->
      <rect x="360" y="368" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="368" width="240" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="480" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Handle request as acting user</text>
      <text x="480" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same downstream handling</text>

      <!-- Legend strip -->
      <line x1="40" y1="572" x2="960" y2="572" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="596" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="604" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Start / end</text>

      <rect x="200" y="596" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="232" y="604" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Step</text>

      <polygon points="332,604 344,596 356,604 344,612" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="368" y="604" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Decision</text>

      <line x1="480" y1="600" x2="508" y2="600" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="516" y="604" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Happy path</text>

      <line x1="612" y1="600" x2="640" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="648" y="604" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Branch</text>

      <line x1="744" y1="600" x2="772" y2="600" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="780" y="604" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Return / reversal</text>
    </svg>
  </div>
</body>
</html>
