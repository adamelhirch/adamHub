<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal planning flow</title>
  <!-- Type: Flowchart (decision branches). Budget: 8 nodes, 9 arrows.
       Cut: the "auto-add off" and "confirm cooked" steps converge directly so the
       flow stays under the 9-node / 12-arrow budget. -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Meal planning</p>
    <h1>From recipe to cooked meal</h1>

    <svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="meal-planning-flow-title meal-planning-flow-desc">
      <title id="meal-planning-flow-title">From recipe to cooked meal</title>
      <desc id="meal-planning-flow-desc">Flowchart showing how a recipe becomes a planned meal (validated one plan per slot per day), optionally syncs missing ingredients to the grocery list, then consumes pantry stock on cook confirmation — with unconfirm reversing the consumption.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <line x1="360" y1="88" x2="360" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="460" y1="168" x2="720" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="216" x2="360" y2="248" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="360" y1="296" x2="360" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="424" x2="360" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="504" x2="360" y2="544" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 260,376 H 188 Q 180,376 180,384 V 548 Q 180,556 188,556 H 272 Q 280,556 280,548 V 544"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="460" y1="572" x2="720" y2="572" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 820,600 V 628 Q 820,636 812,636 H 368 Q 360,636 360,628 V 600"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="576" y="148" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="588" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="320" y="224" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="336" y="232" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="320" y="432" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="336" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="208" y="356" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="220" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="552" y="552" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="588" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UNCONFIRM</text>

      <rect x="828" y="608" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="876" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESTORES STOCK</text>

      <!-- Start oval -->
      <rect x="280" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="360" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Create Meal Plan</text>
      <text x="360" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">recipe · day · slot</text>

      <!-- Diamond: slot free? -->
      <polygon points="360,120 460,168 360,216 260,168" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Slot free?</text>
      <text x="360" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">one per slot</text>

      <!-- End oval: 409 Conflict -->
      <rect x="720" y="144" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="800" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">409 Conflict</text>
      <text x="800" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">slot already planned</text>

      <!-- Step: MealPlan created -->
      <rect x="260" y="248" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MealPlan created</text>
      <text x="360" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stores planned_at · slot</text>

      <!-- Diamond: auto-add missing ingredients? -->
      <polygon points="360,328 460,376 360,424 260,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auto-add missing</text>
      <text x="360" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ingredients?</text>

      <!-- Step: sync missing to groceries -->
      <rect x="260" y="456" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sync missing to Groceries</text>
      <text x="360" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">compute vs pantry · merge</text>

      <!-- Step: confirm cooked (focal coral) -->
      <rect x="260" y="544" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="544" width="200" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="360" y="576" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Confirm cooked</text>
      <text x="360" y="588" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">consume pantry · store lots</text>

      <!-- Step: unconfirm cooked -->
      <rect x="720" y="544" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="820" y="576" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Unconfirm cooked</text>
      <text x="820" y="588" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">restore pantry from lots</text>

      <!-- Legend strip -->
      <line x1="40" y1="656" x2="960" y2="656" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="684" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Start / end</text>

      <rect x="200" y="684" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="232" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Step</text>

      <polygon points="332,692 344,684 356,692 344,700" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="368" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Decision</text>

      <line x1="480" y1="688" x2="508" y2="688" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="516" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Happy path</text>

      <line x1="612" y1="688" x2="640" y2="688" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="648" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Branch</text>

      <line x1="744" y1="688" x2="772" y2="688" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="780" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Return / reversal</text>
    </svg>
  </div>
</body>
</html>
