<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supermarket connections</title>
  <!-- Type: Architecture (zones CLIENT / BACKEND). Budget: 7 nodes, 7 arrows.
       Cut: the external store websites are folded into the "Store scraper" node
       (intermarche · carrefour · leclerc · auchan) to stay within the 9-node budget. -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Supermarket connections</p>
    <h1>Scraping and mapping store products</h1>

    <svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="supermarket-connections-title supermarket-connections-desc">
      <title id="supermarket-connections-title">Scraping and mapping store products</title>
      <desc id="supermarket-connections-desc">Architecture showing a client sending search queries and cache_ids to the supermarket API, which resolves an active store connection, decrypts its cookies for the scraper, upserts products into the search cache, and builds durable mappings from cache snapshots onto grocery, pantry, and recipe-ingredient rows. Store metadata is never supplied by the client — it is resolved server-side from the cache.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones (drawn before arrows and nodes) -->

      <rect x="96" y="156" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="116" y="164" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace"

      <rect x="476" y="68" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="76" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">BACKEND</text>

      <!-- Arrows (drawn before boxes) -->
      <path d="M 192,212 H 264 Q 272,212 272,204 V 140 Q 272,132 264,132 H 280"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="368" y1="164" x2="368" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="368" y1="284" x2="368" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="640" y1="284" x2="640" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="208" y="192" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="232" y="200" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEARCH</text>

      <rect x="376" y="184" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESOLVE ACTIVE</text>

      <rect x="376" y="304" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="404" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COOKIES</text>

      <rect x="472" y="368" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="496" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPSERT</text>

      <rect x="488" y="100" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ ROW</text>

      <rect x="648" y="184" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="692" y="192" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SNAPSHOT FIELDS</text>

      <rect x="648" y="304" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="692" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DURABLE LINK</text>

      <!-- Node: Client (input) -->
      <rect x="40" y="180" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="180" width="152" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="188" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>

      <text x="116" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <text x="116" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">personal frontend</text>

      <!-- Node: Supermarket API (backend) -->
      <rect x="280" y="100" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="100" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="288" y="108" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="304" y="116" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="368" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Supermarket API</text>
      <text x="368" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">search · resolve · map</text>

      <!-- Node: Store connection (store) -->
      <rect x="280" y="220" width="176" height="64" rx="6" fill="#f5f5f5"/>

      <text x="368" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Store connection</text>
      <text x="368" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SupermarketConnection · Fernet</text>

      <!-- Node: Store scraper (backend) -->
      <rect x="280" y="340" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="340" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="288" y="348" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="304" y="356" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCRAPE</text>
      <text x="368" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Store scraper</text>
      <text x="368" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">intermarche · carrefour</text>
      <text x="368" y="395" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">leclerc · auchan</text>

      <!-- Node: Search cache (focal coral) -->
      <rect x="560" y="100" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="100" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="568" y="108" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="584" y="116" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
      <text x="640" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Search cache</text>
      <text x="640" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SupermarketSearchCache · TTL</text>

      <!-- Node: Mapping (store) -->
      <rect x="560" y="220" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="220" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="568" y="228" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="584" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LINK</text>
      <text x="640" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mapping</text>
      <text x="640" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SupermarketMapping · snapshot</text>

      <!-- Node: Target rows (store) -->
      <rect x="560" y="340" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="340" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="568" y="348" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="584" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROW</text>
      <text x="640" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Target rows</text>
      <text x="640" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">grocery · pantry · recipe</text>

      <!-- Legend strip -->
      <line x1="28" y1="488" x2="772" y2="488" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="28" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="28" y="512" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="48" y="520" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Client</text>

      <rect x="120" y="512" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="520" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Backend</text>

      <rect x="216" y="512" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="236" y="520" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Store</text>

      <rect x="296" y="512" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="316" y="520" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Focal</text>

      <line x1="376" y1="516" x2="404" y2="516" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="412" y="520" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">HTTP call</text>

      <line x1="500" y1="516" x2="528" y2="516" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="536" y="520" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Primary / focal</text>
    </svg>
  </div>
</body>
